[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lord-sumi-csv-reconcile"
version = "0.1.0"
description = "Disk-backed CSV reconciliation with exact decimal comparisons"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv-reconcile = "csv_reconcile.__main__:main"

[tool.setuptools.packages.find]
include = ["csv_reconcile*"]
